name: Keepalive Supabase

# Il piano gratuito di Supabase mette in pausa i progetti senza attività per 7 giorni.
# Ogni 3 giorni (e a richiesta) questo workflow chiama la funzione ping() di docs/supabase.sql
# con la chiave pubblica: nessun dato letto o scritto.
# Secrets richiesti (Settings → Secrets and variables → Actions → New repository secret):
#   SUPABASE_URL       es. https://xxxx.supabase.co
#   SUPABASE_ANON_KEY  la chiave pubblica (anon / publishable), MAI la service_role
on:
  schedule:
    - cron: '23 5 */3 * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Chiama ping()
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::error::Mancano i secrets SUPABASE_URL e/o SUPABASE_ANON_KEY (Settings → Secrets and variables → Actions)"
            exit 1
          fi
          response=$(curl -fsS --retry 3 --retry-delay 15 --max-time 30 \
            -X POST "${SUPABASE_URL%/}/rest/v1/rpc/ping" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Content-Type: application/json" \
            -d '{}')
          echo "Risposta: $response"
          [ "$response" = '"pong"' ] || { echo "::error::Risposta inattesa da ping()"; exit 1; }
